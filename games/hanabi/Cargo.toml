[package]
name = "hanabi"
description = "HANABI: a two-player festival-night shooter for KAGAMI. Scrolling river, line-scroll reflections and a sprite budget pushed on purpose."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hanabi"
path = "src/main.rs"

[dependencies]
kagami = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kagami-runtime = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
kagami-web = { workspace = true }

[lints]
workspace = true
