[package]
name = "ippon"
description = "IPPON: a two-player kendo duel for KAGAMI. The reference cartridge for lockstep netplay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ippon"
path = "src/main.rs"

[dependencies]
kagami = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kagami-runtime = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
kagami-web = { workspace = true }

[lints]
workspace = true
