<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAGAMI 鏡</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1c1c1c; color: #f8f4e6; font-family: ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; width: min(96vw, calc(96vh * 256 / 224)); aspect-ratio: 256 / 224; background: #000; outline: 2px solid #165e83; }
  #hud { font-size: 13px; opacity: .8; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  #hud b { color: #f8b500; }
  button { font: inherit; background: #223a70; color: #fffffc; border: 0; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #165e83; }
  .kanji { font-size: 20px; letter-spacing: .3em; }
  #netplay { width: min(96vw, 760px); font-size: 13px; }
  #netplay .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  #netplay textarea { width: 100%; box-sizing: border-box; background: #111; color: #a0d8ef; border: 1px solid #223a70; font: inherit; }
</style>
</head>
<body>
  <div class="kanji">鏡 KAGAMI</div>
  <canvas id="screen" width="256" height="224"></canvas>
  <details id="netplay">
    <summary>netplay (no server: swap codes with a friend)</summary>
    <div class="row">
      <label>mode <select id="np-mode"><option value="lockstep">lockstep</option><option value="rollback">rollback</option></select></label>
      <label>delay <input id="np-delay" type="number" min="0" max="32" value="2" size="3"></label>
      <button id="np-host">host: make offer code</button>
      <button id="np-join">join: answer an offer code</button>
      <span id="np-status">idle</span>
    </div>
    <textarea id="np-code" rows="3" placeholder="codes appear here / paste the other player's code here"></textarea>
    <button id="np-accept">host: accept answer code</button>
  </details>
  <div id="hud">
    <span>cart <b id="title">…</b></span>
    <span>frame <b id="frame">0</b></span>
    <span>hash <b id="hash">—</b></span>
    <span>fps <b id="fps">0</b></span>
    <button id="sound">sound on</button>
    <button id="save-replay">save replay</button>
    <label><input id="load-replay" type="file" accept=".kgmr" hidden>load replay</label>
    <input id="scrub" type="range" min="0" max="0" value="0" hidden style="width:200px">
    <span>P1 arrows · Z X C · Enter — P2 WASD · J K L · Tab</span>
    <span><a href="?cart=ippon" style="color:#a0d8ef">ippon</a> · <a href="?cart=hanabi" style="color:#a0d8ef">hanabi</a></span>
  </div>
  <script type="module">
    import { boot } from './kagami.js';
    const params = new URLSearchParams(location.search);
    const cart = params.get('cart') ?? 'ippon';
    const seed = Number(params.get('seed') ?? 1) >>> 0;
    const players = Number(params.get('players') ?? 2);
    const console_ = await boot({
      wasmUrl: `./dist/${cart}.wasm`,
      canvas: document.getElementById('screen'),
      seed,
      players,
      autostart: params.get('autostart') !== '0',
      onFrame: (c) => {
        if (c.replayPlaying) document.getElementById('scrub').value = c.frame;
        document.getElementById('frame').textContent = c.frame;
        document.getElementById('hash').textContent = c.hash;
        document.getElementById('fps').textContent = c.fps;
      },
    });
    document.getElementById('title').textContent = console_.title;
    document.getElementById('sound').addEventListener('click', () => console_.enableSound());
    window.kagami = console_;

    // Replays: download the match so far, or drop a .kgmr on the page.
    document.getElementById('save-replay').addEventListener('click', () => {
      const bytes = console_.exportReplay();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
      a.download = `${cart}-${console_.recordedFrames}f.kgmr`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
    const loadReplayFile = async (file) => {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const n = console_.loadReplay(bytes);
      document.getElementById('title').textContent = n === null ? `${console_.title} (not a replay)` : `${console_.title} replay, ${n} frames`;
      const scrub = document.getElementById('scrub');
      if (n !== null) { scrub.hidden = false; scrub.max = n; console_.start(); }
    };
    const scrub = document.getElementById('scrub');
    scrub.addEventListener('input', () => { console_.stop(); console_.seekReplay(Number(scrub.value)); });
    scrub.addEventListener('change', () => { console_.start(); });
    document.getElementById('load-replay').addEventListener('change', (e) => { if (e.target.files[0]) loadReplayFile(e.target.files[0]); });
    document.body.addEventListener('dragover', (e) => e.preventDefault());
    document.body.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) loadReplayFile(e.dataTransfer.files[0]); });

    // Netplay UI.
    const { hostLink, joinLink, attachNetplay } = await import('./netplay.js');
    const $ = (id) => document.getElementById(id);
    const status = (s) => { $('np-status').textContent = s; };
    let link = null;
    const begin = (localPlayer) => {
      const rollback = $('np-mode').value === 'rollback';
      const delay = Number($('np-delay').value);
      console_.stop();
      attachNetplay(console_, link, { localPlayer, players: 2, delay, rollback });
      console_.start();
      status(`connected as P${localPlayer + 1} (${rollback ? 'rollback' : 'lockstep'}, delay ${delay})`);
    };
    $('np-host').addEventListener('click', async () => {
      status('gathering…');
      link = await hostLink();
      $('np-code').value = link.code;
      status('send this offer code to the guest, then paste their answer and accept');
    });
    $('np-accept').addEventListener('click', async () => {
      if (!link) return;
      status('connecting…');
      await link.accept($('np-code').value);
      begin(0);
    });
    $('np-join').addEventListener('click', async () => {
      status('answering…');
      link = await joinLink($('np-code').value);
      $('np-code').value = link.code;
      status('send this answer code back to the host; the match starts when they accept');
      await link.opened;
      begin(1);
    });
    window.kagamiNet = { hostLink, joinLink, attachNetplay, get link() { return link; } };
  </script>
</body>
</html>
